[project]
name = "hypotree"
version = "0.4.1"
description = "Memory that forgets: a persistent, self-revising belief-state MCP server for agentic R&D. Uses a hypothesis DAG to auto-prune dead ends and deduce truth without extra probes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Damian Borowski", email = "24823269+tygryso@users.noreply.github.com" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "agent",
    "llm",
    "hypothesis",
    "belief-state",
    "belief-revision",
    "dag",
    "thompson-sampling",
    "research",
    "rag-alternative",
    "ai-agents",
    "agentic-memory",
]
classifiers = [
    # Beta, not Production/Stable: the API is pre-1.0. The schema now migrates
    # forward on open, so an upgrade no longer costs the belief state.
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "networkx>=3.3",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "mcp>=1.28.1,<2",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/tygryso/hypotree"
Repository = "https://github.com/tygryso/hypotree"
Issues = "https://github.com/tygryso/hypotree/issues"
Changelog = "https://github.com/tygryso/hypotree/blob/master/CHANGELOG.md"
Documentation = "https://github.com/tygryso/hypotree/blob/master/src/hypotree/AGENT_GUIDE.md"

[project.scripts]
hypotree = "hypotree.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hypotree"]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.format]
# Illustrative code samples inside the planning docs use hand-aligned trailing
# comments for readability; keep the formatter off Markdown so it only governs
# real source under src/ and tests/.
exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: engine internals, no transport",
    "integration: direct engine calls (no HTTP)",
    "e2e: spawn mcp_server.py over stdio",
]
addopts = "--strict-markers"